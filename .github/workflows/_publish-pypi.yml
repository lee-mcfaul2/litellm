name: Reusable — publish Python artifacts

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.12"
      uv-version:
        type: string
        default: "0.10.9"
      repository-url:
        type: string
        required: false
        default: ""
      project-name:
        type: string
        default: "litellm"
        description: "PyPI project name (default 'litellm'; override for TestPyPI / fork testing)"
      expected-version:
        type: string
        required: true
      environment-name:
        type: string
        required: false
        default: ""
        description: "GitHub deployment environment to gate this run on. Leave blank to skip env gating."
    outputs:
      hashes:
        description: "base64-encoded sha256sum block for dist/* — feed to slsa-github-generator"
        value: ${{ jobs.publish.outputs.hashes }}

permissions: {}

jobs:
  publish:
    name: Build, publish, and attest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment-name }}
    permissions:
      id-token: write
      contents: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          version: ${{ inputs.uv-version }}
          enable-cache: false
      - name: Copy model prices backup
        run: cp model_prices_and_context_window.json litellm/model_prices_and_context_window_backup.json
      - name: Build package
        run: |
          rm -rf build dist
          uv build
      - name: Verify build artifacts
        env:
          EXPECTED_VERSION: ${{ inputs.expected-version }}
        run: |
          set -euo pipefail
          ls -la dist/
          ls dist/*.tar.gz
          ls dist/*.whl
          ls dist/ | grep -q -- "-${EXPECTED_VERSION}" || {
            echo "::error::Built artifacts do not match expected version $EXPECTED_VERSION"
            exit 1
          }
      - name: Validate package metadata
        run: uv tool run --from 'twine==6.2.0' twine check dist/*
      - name: Compute artifact hashes for SLSA provenance
        id: hash
        run: |
          set -euo pipefail
          cd dist
          HASHES=$(sha256sum * | base64 -w0)
          echo "hashes=$HASHES" >> "$GITHUB_OUTPUT"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # v1.13.0
        with:
          attestations: true
          verify-metadata: true
          verbose: true
          repository-url: ${{ inputs.repository-url }}
      - name: Verify PEP 740 attestation landed
        env:
          VERSION: ${{ inputs.expected-version }}
          PROJECT: ${{ inputs.project-name }}
          REPO_URL: ${{ inputs.repository-url }}
        run: |
          set -euo pipefail
          # PyPI propagation can take 30-90s after publish; wait before first check.
          sleep 30
          if [[ "$REPO_URL" == *test.pypi.org* ]]; then
            HOST="https://test.pypi.org"
          else
            HOST="https://pypi.org"
          fi
          for ARTIFACT in dist/*.whl dist/*.tar.gz; do
            FILENAME=$(basename "$ARTIFACT")
            URL="$HOST/integrity/$PROJECT/$VERSION/$FILENAME/provenance"
            echo "Checking $URL"
            RESPONSE=$(curl -fsSL --retry 5 --retry-delay 60 --retry-all-errors --max-time 30 "$URL")
            BUNDLE_COUNT=$(echo "$RESPONSE" | python3 -c "
          import json, sys
          try:
              d = json.loads(sys.stdin.read())
          except json.JSONDecodeError as e:
              sys.stderr.write(f'::error::PyPI returned non-JSON response: {e}\n')
              sys.exit(1)
          bundles = d.get('attestation_bundles') or []
          print(sum(len(b.get('attestations') or []) for b in bundles))
          ")
            if [ "$BUNDLE_COUNT" -lt 1 ]; then
              echo "::error::No PEP 740 attestation found for $FILENAME at $URL"
              exit 1
            fi
            echo "  attestations: $BUNDLE_COUNT"
          done
      - name: Upload sdist and wheel to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.expected-version }}
        run: |
          set -euo pipefail
          gh release upload "v${VERSION}" dist/*.whl dist/*.tar.gz \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
