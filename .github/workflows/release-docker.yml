    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  verify-all:
    name: Final verification (consumer-style)
    needs:
      - preflight
      - build-litellm
      - build-litellm-database
      - build-litellm-spend-logs
      - build-litellm-non-root
      - provenance-litellm
      - provenance-litellm-database
      - provenance-litellm-spend-logs
      - provenance-litellm-non-root
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: litellm
            digest: ${{ needs.build-litellm.outputs.digest }}
          - name: litellm-database
            digest: ${{ needs.build-litellm-database.outputs.digest }}
          - name: litellm-spend-logs
            digest: ${{ needs.build-litellm-spend-logs.outputs.digest }}
          - name: litellm-non-root
            digest: ${{ needs.build-litellm-non-root.outputs.digest }}
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_RELEASE }}
      - name: Install slsa-verifier
        run: |
          set -euo pipefail
          SLSA_VERIFIER_VERSION=2.7.0
          BASE_URL="https://github.com/slsa-framework/slsa-verifier/releases/download/v${SLSA_VERIFIER_VERSION}"
          cd /tmp
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --max-time 60 \
            -O "${BASE_URL}/slsa-verifier-linux-amd64"
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --max-time 30 \
            -O "${BASE_URL}/slsa-verifier-linux-amd64.sha256"
          sha256sum -c slsa-verifier-linux-amd64.sha256
          chmod +x slsa-verifier-linux-amd64
          sudo mv slsa-verifier-linux-amd64 /usr/local/bin/slsa-verifier
      - name: Verify cosign signature
        env:
          DIGEST: ${{ matrix.digest }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          TAG_ESC=$(printf '%s' "${TAG}" | sed 's/\./\\./g')
          IDENTITY_RE="^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/release-docker\.yml@refs/tags/${TAG_ESC}$"
          cosign verify \
            --certificate-identity-regexp="${IDENTITY_RE}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}@${DIGEST}"
      - name: Verify SLSA provenance
        env:
          DIGEST: ${{ matrix.digest }}
        run: |
          set -euo pipefail
          slsa-verifier verify-image \
            --source-uri "github.com/${GITHUB_REPOSITORY}" \
            --source-tag "${{ needs.preflight.outputs.tag }}" \
            "ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}@${DIGEST}"
