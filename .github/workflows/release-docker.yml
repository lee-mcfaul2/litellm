name: Build, Publish and Sign LiteLLM Docker images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.83.14-stable)"
        required: true
      commit_hash:
        description: "Source commit hash the tag must resolve to"
        required: true
      release_type:
        description: "stable | nightly | rc | poc"
        type: string
        default: "stable"
      enable_docker_hub:
        description: "Also push to docker.io/litellm/* (requires Docker Hub OIDC federation)"
        type: boolean
        default: false

permissions: {}

jobs:
  preflight:
    name: Preflight tag/commit verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    environment: docker-release
    # Repository guard: BerriAI/litellm is canonical; lee-mcfaul2/litellm is the
    # author's fork used for end-to-end verification before opening the PR.
    # The fork allowlist must be removed (or the fork left to drift) before merging
    # this PR upstream — otherwise anyone could fork to that path and trigger this
    # workflow under their own identity.
    if: |
      github.repository == 'BerriAI/litellm'
      || github.repository == 'lee-mcfaul2/litellm'
    outputs:
      tag: ${{ inputs.tag }}
      commit_hash: ${{ inputs.commit_hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Verify tag resolves to commit_hash
        env:
          TAG: ${{ inputs.tag }}
          EXPECTED: ${{ inputs.commit_hash }}
        run: |
          set -euo pipefail
          RESOLVED=$(git rev-parse "${TAG}^{commit}")
          if [ "${RESOLVED}" != "${EXPECTED}" ]; then
            echo "::error::Tag ${TAG} resolves to ${RESOLVED}, expected ${EXPECTED}"
            exit 1
          fi
          echo "Tag ${TAG} -> ${RESOLVED} OK"

  build-litellm:
    name: Build, push, sign — litellm
    needs: preflight
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: ./.github/workflows/_publish-container.yml
    with:
      image-name: litellm
      dockerfile: ./Dockerfile
      context: .
      tag: ${{ needs.preflight.outputs.tag }}
      commit-hash: ${{ needs.preflight.outputs.commit_hash }}
      enable-docker-hub: ${{ inputs.enable_docker_hub }}

  build-litellm-database:
    name: Build, push, sign — litellm-database
    needs: preflight
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: ./.github/workflows/_publish-container.yml
    with:
      image-name: litellm-database
      dockerfile: ./docker/Dockerfile.database
      context: .
      tag: ${{ needs.preflight.outputs.tag }}
      commit-hash: ${{ needs.preflight.outputs.commit_hash }}
      enable-docker-hub: ${{ inputs.enable_docker_hub }}

  build-litellm-non-root:
    name: Build, push, sign — litellm-non-root
    needs: preflight
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: ./.github/workflows/_publish-container.yml
    with:
      image-name: litellm-non-root
      dockerfile: ./docker/Dockerfile.non_root
      context: .
      tag: ${{ needs.preflight.outputs.tag }}
      commit-hash: ${{ needs.preflight.outputs.commit_hash }}
      enable-docker-hub: ${{ inputs.enable_docker_hub }}

  provenance-litellm:
    needs: [preflight, build-litellm]
    permissions:
      id-token: write
      contents: read
      packages: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a  # v2.1.0
    with:
      image: ${{ needs.build-litellm.outputs.image }}
      digest: ${{ needs.build-litellm.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  provenance-litellm-database:
    needs: [preflight, build-litellm-database]
    permissions:
      id-token: write
      contents: read
      packages: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a  # v2.1.0
    with:
      image: ${{ needs.build-litellm-database.outputs.image }}
      digest: ${{ needs.build-litellm-database.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  provenance-litellm-non-root:
    needs: [preflight, build-litellm-non-root]
    permissions:
      id-token: write
      contents: read
      packages: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a  # v2.1.0
    with:
      image: ${{ needs.build-litellm-non-root.outputs.image }}
      digest: ${{ needs.build-litellm-non-root.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  verify-all:
    name: Final verification (consumer-style)
    needs:
      - preflight
      - build-litellm
      - build-litellm-database
      - build-litellm-non-root
      - provenance-litellm
      - provenance-litellm-database
      - provenance-litellm-non-root
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: litellm
            digest: ${{ needs.build-litellm.outputs.digest }}
          - name: litellm-database
            digest: ${{ needs.build-litellm-database.outputs.digest }}
          - name: litellm-non-root
            digest: ${{ needs.build-litellm-non-root.outputs.digest }}
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: 'v2.4.1'  # Keep in sync with _publish-container.yml's default
      - name: Install slsa-verifier
        run: |
          set -euo pipefail
          SLSA_VERIFIER_VERSION=2.7.0
          BASE_URL="https://github.com/slsa-framework/slsa-verifier/releases/download/v${SLSA_VERIFIER_VERSION}"
          cd /tmp
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --max-time 60 \
            -O "${BASE_URL}/slsa-verifier-linux-amd64"
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --max-time 30 \
            -O "${BASE_URL}/slsa-verifier-linux-amd64.sha256"
          sha256sum -c slsa-verifier-linux-amd64.sha256
          chmod +x slsa-verifier-linux-amd64
          sudo mv slsa-verifier-linux-amd64 /usr/local/bin/slsa-verifier
      - name: Verify cosign signature
        env:
          DIGEST: ${{ matrix.digest }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          TAG_ESC=$(printf '%s' "${TAG}" | sed 's/\./\\./g')
          # Cert identity reflects the reusable workflow that signed (job_workflow_ref).
          IDENTITY_RE="^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/_publish-container\.yml@refs/tags/${TAG_ESC}$"
          cosign verify \
            --certificate-identity-regexp="${IDENTITY_RE}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}@${DIGEST}"
      - name: Verify SLSA provenance
        env:
          DIGEST: ${{ matrix.digest }}
        run: |
          set -euo pipefail
          slsa-verifier verify-image \
            --source-uri "github.com/${GITHUB_REPOSITORY}" \
            --source-tag "${{ needs.preflight.outputs.tag }}" \
            "ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}@${DIGEST}"
