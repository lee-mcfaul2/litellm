name: Build, Publish and Sign LiteLLM Docker images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.83.14-stable)"
        required: true
      commit_hash:
        description: "Source commit hash the tag must resolve to"
        required: true
      release_type:
        description: "stable | nightly | rc | poc"
        type: string
        default: "stable"
      enable_docker_hub:
        description: "Also push to docker.io/litellm/* (requires Docker Hub OIDC federation)"
        type: boolean
        default: false

permissions: {}

env:
  COSIGN_RELEASE: v2.4.1

jobs:
  preflight:
    name: Preflight tag/commit verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    environment: docker-release
    # Repository guard: BerriAI/litellm is canonical; lee-mcfaul2/litellm is the
    # author's fork used for end-to-end verification before opening the PR.
    # The fork allowlist must be removed (or the fork left to drift) before merging
    # this PR upstream — otherwise anyone could fork to that path and trigger this
    # workflow under their own identity.
    if: |
      github.repository == 'BerriAI/litellm'
      || github.repository == 'lee-mcfaul2/litellm'
    outputs:
      tag: ${{ inputs.tag }}
      commit_hash: ${{ inputs.commit_hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Verify tag resolves to commit_hash
        env:
          TAG: ${{ inputs.tag }}
          EXPECTED: ${{ inputs.commit_hash }}
        run: |
          set -euo pipefail
          RESOLVED=$(git rev-parse "${TAG}^{commit}")
          if [ "${RESOLVED}" != "${EXPECTED}" ]; then
            echo "::error::Tag ${TAG} resolves to ${RESOLVED}, expected ${EXPECTED}"
            exit 1
          fi
          echo "Tag ${TAG} -> ${RESOLVED} OK"

  build-litellm:
    name: Build, push, sign — litellm
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ghcr.io/${{ github.repository_owner }}/litellm
    steps:
      - name: Checkout source at release commit
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0
        with:
          ref: ${{ needs.preflight.outputs.commit_hash }}
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12
      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub via OIDC
        if: inputs.enable_docker_hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          oidc-federation-id: ${{ vars.DOCKERHUB_OIDC_ID }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@0adf9959216b96bec444f325f1e493d4aa344497  # v6.14
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/litellm:${{ needs.preflight.outputs.tag }}
            ${{ inputs.enable_docker_hub && format('docker.io/litellm/litellm:{0}', needs.preflight.outputs.tag) || '' }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_RELEASE }}
      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/litellm@${DIGEST}"
          if [ "${{ inputs.enable_docker_hub }}" = "true" ]; then
            cosign sign --yes "docker.io/litellm/litellm@${DIGEST}"
          fi
      - name: Post-sign verify
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ needs.preflight.outputs.tag }}
          IMAGE: litellm
        run: |
          set -euo pipefail
          TAG_ESC=$(printf '%s' "${TAG}" | sed 's/\./\\./g')
          IDENTITY_RE="^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/release-docker\.yml@refs/tags/${TAG_ESC}$"
          cosign verify \
            --certificate-identity-regexp="${IDENTITY_RE}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "ghcr.io/${{ github.repository_owner }}/${IMAGE}@${DIGEST}"
      - name: Cleanup on failure — delete just-pushed tag
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ needs.preflight.outputs.tag }}
          IMAGE: litellm
        run: |
          set +e
          # GHCR uses /orgs/{org}/packages/... for orgs, /users/{user}/packages/... for users.
          if gh api "/orgs/${OWNER}" --silent 2>/dev/null; then
            PKG_BASE="/orgs/${OWNER}/packages/container/${IMAGE}"
          else
            PKG_BASE="/users/${OWNER}/packages/container/${IMAGE}"
          fi
          PACKAGE_VERSION_ID=$(gh api "${PKG_BASE}/versions" \
            --jq ".[] | select(.metadata.container.tags[]? == \"${TAG}\") | .id" \
            | head -1)
          if [ -n "${PACKAGE_VERSION_ID}" ]; then
            echo "Deleting partial push: ${IMAGE}:${TAG} (version_id=${PACKAGE_VERSION_ID})"
            gh api -X DELETE "${PKG_BASE}/versions/${PACKAGE_VERSION_ID}"
          else
            echo "No matching package version found for ${IMAGE}:${TAG}; nothing to clean up."
          fi

