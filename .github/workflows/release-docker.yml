      image: ${{ needs.build-litellm.outputs.image }}
      digest: ${{ needs.build-litellm.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  provenance-litellm-database:
    needs: [preflight, build-litellm-database]
    permissions:
      id-token: write
      contents: read
