name: Publish to PyPI

on:
  workflow_dispatch:

jobs:
  preflight-checks:
    name: Preflight Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # No environment — read-only checks, no approval needed
    outputs:
      needs_publish: ${{ steps.check-litellm.outputs.needs_publish }}
      version: ${{ steps.check-litellm.outputs.version }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.9"
          enable-cache: false

      - name: Check litellm version on PyPI
        id: check-litellm
        run: |
          VERSION=$(python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Checking if litellm $VERSION exists on PyPI..."

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/litellm/$VERSION/json")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "litellm $VERSION already exists on PyPI. Skipping publish."
            echo "needs_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "litellm $VERSION not found on PyPI. Publish needed."
            echo "needs_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sanity check proxy-extras version
        run: |
          # Read pinned version from project optional dependencies
          PYPROJECT_VERSION=$(python3 - <<'PY'
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as f:
              proxy_requirements = tomllib.load(f)["project"]["optional-dependencies"]["proxy"]

          version = None
          for requirement in proxy_requirements:
              normalized = requirement.split(";", 1)[0].strip()
              if not normalized.startswith("litellm-proxy-extras"):
                  continue
              parts = normalized.split("==", 1)
              if len(parts) == 2 and parts[0].strip() == "litellm-proxy-extras":
                  candidate = parts[1].strip()
                  if candidate:
                      version = candidate
                      break

          if version is None:
              print(
                  "::error::Could not find an exact litellm-proxy-extras pin in project.optional-dependencies.proxy",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(version)
          PY
          )
          echo "pyproject.toml pins litellm-proxy-extras version: $PYPROJECT_VERSION"

          # Check that the pinned version exists on PyPI
          echo "Checking if litellm-proxy-extras $PYPROJECT_VERSION exists on PyPI..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/litellm-proxy-extras/$PYPROJECT_VERSION/json")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::litellm-proxy-extras $PYPROJECT_VERSION is not published on PyPI yet. Publish it before releasing litellm."
            exit 1
          fi
          echo "litellm-proxy-extras $PYPROJECT_VERSION exists on PyPI. Sanity check passed."

  publish-litellm:
    name: Publish litellm to PyPI
    needs: preflight-checks
    if: needs.preflight-checks.outputs.needs_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    environment: pypi-publish
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.9"
          enable-cache: false

      - name: Copy model prices backup
        run: cp model_prices_and_context_window.json litellm/model_prices_and_context_window_backup.json

      - name: Build package
        run: |
          rm -rf build dist
          uv build

      - name: Verify build artifacts
        env:
          EXPECTED_VERSION: ${{ needs.preflight-checks.outputs.version }}
        run: |
          echo "Contents of dist/:"
          ls -la dist/
          # Ensure we have both sdist and wheel
          ls dist/*.tar.gz
          ls dist/*.whl
          # Verify built version matches expected
          ls dist/ | grep -q "litellm-${EXPECTED_VERSION}" || {
            echo "::error::Built artifacts do not match expected version $EXPECTED_VERSION"
            ls dist/
            exit 1
          }

      - name: Validate package metadata
        run: |
          uv tool run --from 'twine==6.2.0' twine check dist/*

      - name: Compute artifact hashes for SLSA provenance
        id: hash
        run: |
          set -euo pipefail
          cd dist
          HASHES=$(sha256sum * | base64 -w0)
          echo "hashes=$HASHES" >> "$GITHUB_OUTPUT"

      - name: Publish to PyPI
        id: publish
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          attestations: true
          verify-metadata: true

      - name: Verify PEP 740 attestation landed on PyPI
        env:
          VERSION: ${{ needs.preflight-checks.outputs.version }}
        run: |
          set -euo pipefail
          # PyPI exposes attestation bundles at /integrity/<project>/<version>/<filename>/provenance
          # Assert at least one bundle is present for every artifact we just uploaded.
          for ARTIFACT in dist/*.whl dist/*.tar.gz; do
            FILENAME=$(basename "$ARTIFACT")
            URL="https://pypi.org/integrity/litellm/$VERSION/$FILENAME/provenance"
            echo "Checking $URL"
            # PyPI CDN propagation can take 30-90s after publish; retry with backoff.
            # --max-time 30 caps individual attempts; --retry-all-errors handles 404/5xx/network.
            RESPONSE=$(curl -fsSL --retry 5 --retry-delay 30 --retry-all-errors --max-time 30 "$URL")
            BUNDLE_COUNT=$(echo "$RESPONSE" | python3 -c "
          import json, sys
          try:
              d = json.loads(sys.stdin.read())
          except json.JSONDecodeError as e:
              sys.stderr.write(f'::error::PyPI returned non-JSON response: {e}\n')
              sys.exit(1)
          bundles = d.get('attestation_bundles') or []
          print(sum(len(b.get('attestations') or []) for b in bundles))
          ")
            if [ "$BUNDLE_COUNT" -lt 1 ]; then
              echo "::error::PyPI returned no attestations for $FILENAME — PEP 740 attestation did not land"
              exit 1
            fi
            echo "  attestations: $BUNDLE_COUNT"
          done

  provenance:
    name: Generate SLSA L3 build provenance
    needs: [preflight-checks, publish-litellm]
    if: needs.preflight-checks.outputs.needs_publish == 'true'
    permissions:
      id-token: write
      contents: write   # required by slsa-github-generator to upload .intoto.jsonl to the GitHub release
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a  # v2.1.0
    with:
      base64-subjects: ${{ needs.publish-litellm.outputs.hashes }}
      upload-assets: true
      provenance-name: litellm-${{ needs.preflight-checks.outputs.version }}.intoto.jsonl

  verify-slsa:
    name: Verify SLSA provenance with slsa-verifier
    needs: [preflight-checks, publish-litellm, provenance]
    if: needs.preflight-checks.outputs.needs_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.preflight-checks.outputs.version }}
    steps:
      - name: Install slsa-verifier
        run: |
          set -euo pipefail
          SLSA_VERIFIER_VERSION=2.7.0
          BASE_URL="https://github.com/slsa-framework/slsa-verifier/releases/download/v${SLSA_VERIFIER_VERSION}"
          cd /tmp
          # Download with original asset names so sha256sum -c can verify against the sidecar
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --max-time 60 \
            -O "${BASE_URL}/slsa-verifier-linux-amd64"
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --max-time 30 \
            -O "${BASE_URL}/slsa-verifier-linux-amd64.sha256"
          # The sidecar references the original asset name
          sha256sum -c slsa-verifier-linux-amd64.sha256
          chmod +x slsa-verifier-linux-amd64
          sudo mv slsa-verifier-linux-amd64 /usr/local/bin/slsa-verifier

      - name: Download artifacts and provenance from GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p verify
          cd verify
          gh release download "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.whl" \
            --pattern "*.tar.gz" \
            --pattern "*.intoto.jsonl"
          ls -la

      - name: Verify SLSA provenance against each artifact
        run: |
          set -euo pipefail
          cd verify
          PROVENANCE=$(ls *.intoto.jsonl | head -1)
          if [ -z "$PROVENANCE" ]; then
            echo "::error::No .intoto.jsonl found in release assets"
            exit 1
          fi
          echo "Provenance file: $PROVENANCE"
          shopt -s nullglob
          ARTIFACTS=( *.whl *.tar.gz )
          if [ ${#ARTIFACTS[@]} -eq 0 ]; then
            echo "::error::No .whl or .tar.gz artifacts downloaded from release"
            exit 1
          fi
          for ARTIFACT in "${ARTIFACTS[@]}"; do
            echo "Verifying $ARTIFACT"
            slsa-verifier verify-artifact "$ARTIFACT" \
              --provenance-path "$PROVENANCE" \
              --source-uri "github.com/${GITHUB_REPOSITORY}" \
              --source-tag "v${VERSION}"
          done
          echo "All SLSA provenance verifications passed."
